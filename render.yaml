services:
  - type: web
    name: fhn-operations
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Secrets: set these in the Render dashboard (sync: false keeps them out of git).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: STAGE_PHONE
        sync: false
      - key: STAGE_PIN
        sync: false
      - key: NTFY_TOPIC
        sync: false
